  let z=endpointCache.get(mask);if(z)return z;
  z=bits(mask).map(i=>({i,dist:NS[i].dist,bus:NS[i].bus}));

  }
  const full=F-1;let best=INF,be=-1;
  for(let a=0;a<m;a++){const e=ep[ids[a]];if(!e)continue;const v=dp[full*W+a]+e.dist;if(v<best-1e-9||(Math.abs(v-best)<=1e-9&&(be<0||ids[a]<ids[be]))){best=v;be=a;}}
  const rev=[];let s=full,a=be;while(a>=0){rev.push(ids[a]);const pa=par[s*W+a];s^=1<<a;a=pa;}
  const order=rev.reverse(),se=ep[order[0]],ee=ep[order[order.length-1]];
  z={cost:best,order,start:order[0],end:order[order.length-1],bs:se.bus,be:ee.bus};exactCache.set(mask,z);return z;
 }
 function exactTotal(ms){let s=0;for(const m of ms)s+=exact(m).cost;return s;}

 /* Быстрый детерминированный TSP-оценщик для сортировки кандидатов. */
 function fast(mask){
  let z=fastCache.get(mask);if(z!==undefined)return z;
  const ids=bits(mask),m=ids.length;if(!m){fastCache.set(mask,0);return 0;}
  const nearest=ids.map(i=>Math.min(...SP.map(r=>r[i])));
  if(m===1){const v=2*nearest[0];fastCache.set(mask,v);return v;}
  let best=Infinity;
  const starts=ids.slice().sort((a,b)=>nearest[ids.indexOf(a)]-nearest[ids.indexOf(b)]||a-b).slice(0,5);
  for(const s0 of starts){
   const o=[s0],left=ids.filter(i=>i!==s0);
   while(left.length){let bi=0,bv=Infinity;for(let j=0;j<left.length;j++){const q=D[o[o.length-1]][left[j]];if(q<bv-1e-9||(Math.abs(q-bv)<=1e-9&&left[j]<left[bi])){bv=q;bi=j;}}o.push(left.splice(bi,1)[0]);}
   for(let p=0;p<4;p++){
    let ch=false;
    for(let i=0;i<o.length-2;i++)for(let j=i+1;j<o.length-1;j++){
      const a=o[i],b=o[i+1],c=o[j],d=o[j+1];
      if(D[a][c]+D[b][d]<D[a][b]+D[c][d]-1e-7){for(let l=i+1,r=j;l<r;l++,r--){const t=o[l];o[l]=o[r];o[r]=t;}ch=true;}
    }
    if(!ch)break;
   }
   let c=nearest[ids.indexOf(o[0])]+nearest[ids.indexOf(o[o.length-1])];
   for(let i=1;i<o.length;i++)c+=D[o[i-1]][o[i]];
   best=Math.min(best,c);
  }
  fastCache.set(mask,best);return best;
 }
 function fastTotal(ms){let s=0;for(const m of ms)s+=fast(m);return s;}



 /* ===== Недельные шаблоны: адрес с k визитами получает набор из k разных дней недели ===== */
 const subs=k=>{const o=[];for(let m=1;m<(1<<ND);m++)if(pop(m)===k)o.push(m);return o;};
 const adjc=m=>{let c=0;for(let d=0;d<ND-1;d++)if((m>>d&1)&&(m>>(d+1)&1)&&WD[d+1]-WD[d]===1)c++;return c;};
 const PAT=K.map(k=>subs(Math.max(1,Math.min(ND,k))));
 /* штраф за визиты в соседние дни сверх неизбежного минимума (для 3 визитов это Пн/Ср/Пт) */
 const PEN=PAT.map(l=>{const mn=Math.min(...l.map(adjc));return l.map(m=>SPW*(adjc(m)-mn));});
 const dayMasks=pat=>{const dm=Array(ND).fill(0);for(let i=0;i<n;i++){const m=PAT[i][pat[i]];for(let d=0;d<ND;d++)if(m>>d&1)dm[d]|=1<<i;}return dm;};
 const imb=dm=>{const c=dm.map(pop);return BAL*Math.max(0,Math.max(...c)-Math.min(...c)-2);};
 const penTot=pat=>{let s=0;for(let i=0;i<n;i++)s+=PEN[i][pat[i]];return s;};
 const capOk=dm=>dm.every(m=>pop(m)<=CAP);
 const mkRnd=seed=>{let x=seed|0;return()=>{x|=0;x=(Math.imul(x^x>>>13,1274126177)+0x6D2B79F5)|0;return((x^x>>>16)>>>0)/4294967296;};};

 function initPat(rnd){
  const load=Array(ND).fill(0),pat=Array(n).fill(0);
  const ord=[...Array(n).keys()].sort((a,b)=>K[b]-K[a]||rnd()-.5);
  for(const i of ord){
   let bi=0,bv=Infinity;
   PAT[i].forEach((m,q)=>{
    let mx=0,ok=true;
    for(let d=0;d<ND;d++)if(m>>d&1){if(load[d]+1>CAP)ok=false;mx=Math.max(mx,load[d]+1);}
    const v=(ok?0:1e6)+mx*1000+PEN[i][q]+rnd();
    if(v<bv){bv=v;bi=q;}
   });
   pat[i]=bi;for(let d=0;d<ND;d++)if(PAT[i][bi]>>d&1)load[d]++;
  }
  return pat;
 }
 function sa(seed,steps,start){
  const rnd=mkRnd(seed);
  let pat=start.slice(),dm=dayMasks(pat),cur=fastTotal(dm)+penTot(pat)+imb(dm),best={e:cur,pat:pat.slice()};
  const idx=[];for(let i=0;i<n;i++)if(PAT[i].length>1)idx.push(i);
  for(let it=0;it<steps&&idx.length&&performance.now()<deadline;it++){
   const temp=500*Math.pow(0.01,it/steps);
   const i=idx[Math.floor(rnd()*idx.length)],old=pat[i];
   let q=Math.floor(rnd()*(PAT[i].length-1));if(q>=old)q++;
   pat[i]=q;
   const nd=dayMasks(pat);
   if(!capOk(nd)){pat[i]=old;continue;}
   const e=fastTotal(nd)+penTot(pat)+imb(nd),d=e-cur;
   if(d<=0||rnd()<Math.exp(-d/temp)){cur=e;if(e<best.e-1e-7)best={e,pat:pat.slice()};}
   else pat[i]=old;
  }
  return best;
 }
 /* точная доводка: меняем шаблон одного адреса, пока это уменьшает точную стоимость */
 function polish(p0){
  const pat=p0.slice();
  const En=(p,ex)=>{const d=dayMasks(p);return capOk(d)?(ex?exactTotal(d):fastTotal(d))+penTot(p)+imb(d):Infinity;};
  let cur=En(pat,true);
  const moves=[];for(let i=0;i<n;i++)for(let q=0;q<PAT[i].length;q++)moves.push([i,q]);
  for(let rd=0;rd<60;rd++){
   let bi=-1,bq=-1,be=cur;
   for(const [i,q] of moves){
    if(q===pat[i])continue;
    const o=pat[i];pat[i]=q;const e=En(pat,true);pat[i]=o;
    if(e<be-1e-7){be=e;bi=i;bq=q;}
   }
   if(bi>=0){pat[bi]=bq;cur=be;continue;}
   /* пары одновременных изменений: сначала дешёвая оценка, затем точная проверка лучших */
   const cand=[];
   for(let a=0;a<moves.length;a++){
    const [i,q]=moves[a];if(q===pat[i])continue;
    for(let b=a+1;b<moves.length;b++){
     const [j,w]=moves[b];if(j===i||w===pat[j])continue;
     const oi=pat[i],oj=pat[j];pat[i]=q;pat[j]=w;const e=En(pat,false);pat[i]=oi;pat[j]=oj;
     if(e<Infinity)cand.push([e,i,q,j,w]);
    }
   }
   cand.sort((x,y)=>x[0]-y[0]);
   let hit=false;
   for(let c=0;c<Math.min(60,cand.length);c++){
    const [,i,q,j,w]=cand[c],oi=pat[i],oj=pat[j];pat[i]=q;pat[j]=w;
    const e=En(pat,true);
    if(e<cur-1e-7){cur=e;hit=true;break;}
    pat[i]=oi;pat[j]=oj;
   }
   if(!hit)break;
  }
  return{e:cur,pat};
 }
 let best=null;
 const STEPS=CF&&CF.STEPS||60000,RESTARTS=CF&&CF.RESTARTS||8;
 for(let r=0;r<RESTARTS&&(r===0||performance.now()<deadline);r++){
  const st=initPat(mkRnd(0x9e3779b1*(r+1)));
  const s=sa(0x13579B+r*7919,STEPS,st),p=polish(s.pat);
  if(!best||p.e<best.e-1e-7)best=p;
 }
 const dm=dayMasks(best.pat);
 const days=dm.map(mask=>{
  if(!mask)return{cnt:0,pts:[],legs:[],route:[],dist:0};
  const z=exact(mask),pts=z.order.map(i=>P[i]),start=BUS[z.bs],finish=BUS[z.be];
  return{cnt:pts.length,pts,legs:z.order.slice(1).map((j,k)=>({a:P[z.order[k]],b:P[j],w:D[z.order[k]][j]})),start,finish,startAddr:P[z.start],finishAddr:P[z.end],startDist:SP[z.bs][z.start],finishDist:SP[z.be][z.end],dist:z.cost,route:[start,...pts,finish]};
 });
 const out=[0,1,2,3,4].map(w=>{const s=WD.indexOf(w);return s<0?{cnt:0,pts:[],legs:[],route:[],dist:0}:days[s];});
 return{days:out,total:exactTotal(dm),penalty:penTot(best.pat),energy:best.e,target:dm.map(pop)};
}
onmessage=e=>{try{const t=performance.now(),r=optimize(e.data.P,e.data.BUS,e.data.K,e.data.CAP,e.data.budgetMs,e.data.initialMasks,e.data.CF);postMessage({ok:true,result:r,elapsed:performance.now()-t});}catch(x){postMessage({ok:false,error:String(x&&x.message||x)});}};
`;
function runOptimizer(P,K,initialMasks,ND){return new Promise((resolve,reject)=>{const w=new Worker(URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'})));let timer;const done=()=>{clearTimeout(timer);w.terminate();};w.onmessage=e=>{if(e.data&&e.data.type==='best')return;done();if(e.data&&e.data.ok)resolve(e.data);else reject(Error(e.data&&e.data.error||'Ошибка расчёта.'));};w.onerror=()=>{done();reject(Error('Ошибка фонового расчёта.'));};timer=setTimeout(()=>{done();reject(Error('Расчёт превысил лимит.'));},OPT_MS+5000);w.postMessage({P,BUS,K,CAP:CFG.MAXPTS,budgetMs:OPT_MS,initialMasks,CF:{SPW:CFG.SPW,BAL:CFG.BAL,ND}});});}
$('#go').onclick=async()=>{
 const n=S.addrs.length;if(n<1){$('#st').textContent='Добавьте хотя бы один адрес.';return;}
 const K=S.addrs.map(a=>Math.max(1,Math.min(5,+a.k||1))),total=K.reduce((a,b)=>a+b,0);
 if(total>5*CFG.MAXPTS){$('#st').textContent='Слишком много посещений для пяти маршрутов.';return;}
 const maxK=Math.max(...K),need=Math.max(1,maxK,Math.ceil(total/CFG.MAXPTS)),sel=$('#dn').value,ND=sel==='auto'?need:+sel;
 if(ND<need){$('#st').textContent='Для этих адресов нужно не меньше '+need+' дн.: у одного адреса до '+maxK+' визитов, а в день не больше '+CFG.MAXPTS+' точек.';return;}
 try{localStorage.setItem('rp_days',sel);}catch(e){}
 $('#go').disabled=true;$('#st').textContent='Оптимизирую…';
 const initialMasks=(S.plan&&Array.isArray(S.plan.days))?S.plan.days.map(d=>{let m=0;for(const p of (d.pts||[])){const i=S.addrs.findIndex(a=>a.t===p.t);if(i>=0)m|=1<<i;}return m;}):null;try{const r=await runOptimizer(S.addrs,K,initialMasks,ND);S.plan={days:r.result.days,objective:r.result.total};save();show();$('#st').textContent='';document.title='Пеший планировщик';}
 catch(e){console.error(e);$('#st').textContent='Не удалось завершить расчёт.';}
 finally{$('#go').disabled=false;}
};

function mapSvg(d){
  const route=d.route||[];if(!route.length)return '';
  const pts=S.addrs||[];const xs=route.map(a=>a.lon),ys=route.map(a=>a.lat);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const pad=0.0025;x0-=pad;x1+=pad;y0-=pad;y1+=pad;
  const W=520,H=300,M=20,cs=Math.cos(((y0+y1)/2)*Math.PI/180);const s=Math.min((W-2*M)/Math.max((x1-x0)*cs,1e-9),(H-2*M)/Math.max(y1-y0,1e-9));const X=a=>M+(a.lon-x0)*cs*s,Y=a=>H-M-(a.lat-y0)*s;
  let g='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" style="max-width:100%;height:auto;border:1px solid var(--bd);border-radius:8px;margin-top:10px;background:var(--bg)">';
  pts.forEach(a=>{g+='<circle cx="'+X(a).toFixed(1)+'" cy="'+Y(a).toFixed(1)+'" r="2.4" fill="var(--bd)"/>';});
  g+='<polyline fill="none" stroke="var(--ac)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="'+route.map(a=>X(a).toFixed(1)+','+Y(a).toFixed(1)).join(' ')+'"/>';
  route.forEach((a,k)=>{const isStart=k===0,isFinish=k===route.length-1;g+='<circle cx="'+X(a).toFixed(1)+'" cy="'+Y(a).toFixed(1)+'" r="'+(isStart||isFinish?6:4)+'" fill="'+(isStart?'#16a34a':isFinish?'#dc2626':'var(--ac)')+'" stroke="var(--card)" stroke-width="1.5"/>';});
  return g+'</svg><div class="m">Серые точки — адреса из списка. Цветная линия — порядок маршрута.</div>';
}
function show(){
  const p=S.plan;if(!p){$('#out').innerHTML='';return;}
  let h='<div class="hint">Общее прямое расстояние за неделю: <b>'+fmtD(p.objective)+'</b> · дней: '+p.days.filter(d=>d.cnt).length+' · точек по дням: '+p.days.filter(d=>d.cnt).map(d=>d.cnt).join('/')+'</div>';
  p.days.forEach((d,i)=>{
    if(!d||!d.cnt){h+='<div class="m" style="margin:10px 0">'+DN[i]+': свободный день</div>';return;}

    d.pts.forEach((a,k)=>{const w=k?d.legs[k-1].w:0,f=far(a);rows+='<div class="row"><span class="t">'+(k+1)+'. '+esc(a.t)+(k?' <span class="m">· '+fmtD(w)+' от предыдущей</span>':'')+(f>700?' <span class="w">· адрес стоит отдельно, ближайший другой адрес в '+fmtD(f)+'</span>':'')+'</span></div>';});
    h+='<div class="card"><div class="row"><span class="t"><b>'+DN[i]+'</b> · '+d.cnt+' адресов</span><b class="total">'+fmtD(d.dist)+'</b></div>'+
      '<div class="m">Старт: '+esc(d.start?.t||'—')+' → '+esc(d.startAddr?.t||'—')+' ('+fmtD(d.startDist||0)+')</div>'+rows+
      '<div class="m">Финиш: '+esc(d.finishAddr?.t||'—')+' → '+esc(d.finish?.t||'—')+' ('+fmtD(d.finishDist||0)+')</div>'+
      mapSvg(d)+(d.route&&d.route.length>1?'<div class="m" style="margin-top:8px"><a target="_blank" rel="noopener" href="'+yl(d.route)+'">Открыть маршрут в Яндекс Картах</a></div>':'')+
      '</div>';
  });
  $('#out').innerHTML=h;
}
